<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>34th Graduation List | Kampala International University</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --kiu-green: #006633;
      --kiu-green-dark: #004d26;
      --kiu-green-light: #e8f5ee;
      --kiu-gold: #fff200;
      --text-dark: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", Arial, sans-serif;
      color: var(--text-dark);
      background: #fff;
      min-height: 100vh;
    }

    .navbar {
      height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: #fff;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      color: var(--kiu-green);
      text-decoration: none;
    }

    .brand-mark {
      display: block;
      width: clamp(140px, 17vw, 180px);
      height: clamp(54px, 6vw, 62px);
      object-fit: cover;
      object-position: center 47%;
    }

    .navbar nav {
      position: relative;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    .nav-links a {
      color: var(--text-dark);
      text-decoration: none;
      font-size: 14px;
      font-weight: 650;
    }

    .nav-links a.active { color: var(--kiu-green); }

    .nav-toggle {
      display: none;
      width: 44px;
      height: 44px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--kiu-green-dark);
      cursor: pointer;
    }

    .nav-toggle span {
      display: block;
      width: 100%;
      height: 2px;
      margin: 4px 0;
      background: currentColor;
    }

    .page-shell {
      max-width: 1140px;
      margin: 0 auto;
      padding: 38px 24px 60px;
    }

    .intro {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 24px;
      margin-bottom: 28px;
    }

    .intro h1 {
      font-size: 35px;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .intro p {
      max-width: 760px;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .public-list {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 16px;
      margin-top: 10px;
      border: 1px solid #e4e7eb;
      border-radius: 8px;
      color: #374151;
      background: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .search-panel {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 28px 0;
      margin-bottom: 24px;
    }

    .search-panel label {
      display: block;
      color: #5f6b7a;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 10px;
    }

    .search-form {
      display: flex;
      gap: 12px;
    }

    .search-wrap {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 21px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 50px;
      border: 1px solid #cfd4dc;
      border-radius: 7px;
      padding: 0 16px 0 46px;
      color: var(--text-dark);
      font: 500 16px "Inter", sans-serif;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--kiu-green);
      box-shadow: 0 0 0 3px rgba(0, 102, 51, 0.1);
    }

    .search-button {
      width: 168px;
      height: 50px;
      border: 0;
      border-radius: 7px;
      background: #23a66b;
      color: #fff;
      font: 800 15px "Inter", sans-serif;
      cursor: pointer;
    }

    .search-button:hover { background: var(--kiu-green); }

    .summary {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .summary-chip {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      background: #fff;
      color: #687386;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .summary-chip strong {
      color: var(--kiu-green);
      font-size: 20px;
    }

    .student-list {
      display: grid;
      gap: 12px;
    }

    .student-card {
      min-height: 94px;
      display: grid;
      grid-template-columns: 70px minmax(250px, 1fr) minmax(230px, 1fr) 220px;
      align-items: center;
      gap: 10px;
      padding: 12px 22px 12px 12px;
      border: 1px solid #dfe3e7;
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 2px 5px rgba(15, 23, 42, 0.03);
    }

    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff200;
      
      color: #00551f;
      font-size: 17px;
      font-weight: 800;
    }

    .student-identity {
      min-width: 0;
    }

    .student-name {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 5px;
    }

    .registration {
      font-family: "Courier New", monospace;
      color: #344054;
      font-size: 12px;
      font-weight: 700;
    }

    .programme {
      color: var(--kiu-green);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
    }

    .programme-sub {
      color: #8a94a3;
      font-size: 12px;
      margin: 3px 0 7px;
    }

    .gender {
      display: inline-flex;
      padding: 2px 8px;
      border-radius: 7px;
      background: #edf0f3;
      color: #667085;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .gender strong {
      margin-left: 5px;
      color: #344054;
      text-transform: none;
    }

    .status-column {
      text-align: right;
      font-size: 12px;
    }

    .cleared {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e2f5ea;
      color: var(--kiu-green);
      font-weight: 800;
      white-space: nowrap;
    }

    .cleared::before {
      content: "✓";
      width: 15px;
      height: 15px;
      border: 1.5px solid #74b99b;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 9px;
    }

    .certificate {
      color: var(--kiu-green);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .certificate.not-ready { color: #b42318; }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 24px;
    }

    .page-button {
      min-width: 38px;
      height: 38px;
      border: 1px solid #dfe3e7;
      border-radius: 7px;
      background: #fff;
      color: #475467;
      font: 700 13px "Inter", sans-serif;
      cursor: pointer;
    }

    .page-button.active {
      border-color: var(--kiu-green);
      background: var(--kiu-green);
      color: #fff;
    }

    .no-results {
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 32px;
      text-align: center;
      color: var(--text-muted);
    }

    @media (max-width: 900px) {
      .nav-links { display: none; }
      .navbar { padding: 0 4%; }
      .brand-mark { width: clamp(125px, 42vw, 170px); }
      .nav-toggle { display: block; }
      .nav-links.is-open {
        position: absolute;
        top: calc(100% + 0.8rem);
        right: 0;
        display: flex;
        flex-direction: column;
        gap: 0;
        width: min(250px, calc(100vw - 2rem));
        padding: 0.5rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
      }
      .nav-links.is-open a { display: block; padding: 0.75rem; }
      .student-card { grid-template-columns: 60px 1fr 220px; }
      .status-column { grid-column: 3; }
    }

    @media (max-width: 620px) {
      .navbar { height: 62px; }
      .brand-mark { width: clamp(125px, 42vw, 170px); }
      .page-shell { padding: 24px 16px 40px; }
      .intro { display: block; }
      .intro h1 { font-size: 27px; }
      .public-list { margin-top: 18px; }
      .search-form { flex-direction: column; }
      .search-button { width: 100%; }
      .summary-chip { padding: 8px 12px; }
      .student-card {
        min-height: 0;
        grid-template-columns: 38px minmax(0, 1fr);
        grid-template-areas:
          "avatar identity"
          "programme programme"
          "status status";
        align-items: start;
        gap: 0;
        padding: 12px;
      }
      .avatar { grid-area: avatar; width: 38px; height: 38px; font-size: 15px; }
      .student-identity { grid-area: identity; }
      .student-name { font-size: 16px; }
      .student-programme { grid-area: programme; margin-top: 10px; }
      .status-column { grid-area: status; margin-top: 8px; text-align: left; }
      .cleared { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="brand" aria-label="Kampala International University home">
      <img src="e29c5efeccb36570f47a2c29acc9a90acdd429a6-kampala-1d3a06dd833a037c4bb2a9836cc5dcfc3297f6df.jpg" class="brand-mark" alt="Kampala International University — Exploring the Heights" />
    </a>
    <nav aria-label="Main navigation">
      <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="primary-navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="#">About Us</a></li>
        <li><a href="#">Study at KIU</a></li>
        <li><a href="#">Academics</a></li>
        <li><a href="graduation-list.html" class="active">Graduation</a></li>
      </ul>
    </nav>
  </header>

  <main class="page-shell">
    <section class="intro">
      <div>
        <h1>34th Graduation List</h1>
        <p>Browse the graduation list. Search with partial names or registration numbers. Use the clearance cards above to narrow the list.</p>
      </div>
      <div class="public-list">
        <span aria-hidden="true">↗</span>
        <span>PUBLIC LISTING</span>
      </div>
    </section>

    <section class="search-panel" aria-labelledby="search-heading">
      <label id="search-heading" for="studentSearch">SEARCH PUBLISHED RECORDS</label>
      <form class="search-form" id="searchForm">
        <div class="search-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="studentSearch" class="search-input" type="search"
            placeholder="Name or registration number" autocomplete="off" />
        </div>
        <button class="search-button" type="submit">Search register</button>
      </form>
    </section>

    <section class="summary" aria-live="polite">
      <div class="summary-chip"><strong id="publishedCount">2,000</strong> published records</div>
      <div class="summary-chip"><strong id="shownCount">1-50</strong> shown on this page</div>
    </section>

    <section id="studentList" class="student-list" aria-label="Graduation students"></section>
    <nav id="pagination" class="pagination" aria-label="Graduation list pages"></nav>
  </main>

  <script>
    const menuToggle = document.querySelector('.nav-toggle');
    const primaryNavigation = document.getElementById('primary-navigation');

    menuToggle.addEventListener('click', () => {
      const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
      menuToggle.setAttribute('aria-expanded', String(!isExpanded));
      menuToggle.setAttribute('aria-label', isExpanded ? 'Open navigation menu' : 'Close navigation menu');
      primaryNavigation.classList.toggle('is-open', !isExpanded);
    });

    primaryNavigation.addEventListener('click', (event) => {
      if (event.target.closest('a')) {
        menuToggle.setAttribute('aria-expanded', 'false');
        menuToggle.setAttribute('aria-label', 'Open navigation menu');
        primaryNavigation.classList.remove('is-open');
      }
    });
  </script>
  <script src="graduation-list.js"></script>
</body>
</html>
